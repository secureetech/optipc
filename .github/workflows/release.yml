# OptiPC 2.0 — compilation, signature SSL.com et publication automatiques.
# Déclenchement : tag « v2.0.0 » (git tag v2.0.0 && git push --tags) ou à la main depuis l'onglet Actions.
#
# Secrets à créer une seule fois dans CE dépôt (Settings > Secrets and variables > Actions),
# les mêmes que pour SecureeTech PDF et Recovery :
#   ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET  (compte SSL.com eSigner)
#
# Après la publication : mettre à jour updates/stable.json dans optipc-api (version, url, sha256, size)
# pour que tous les PC équipés d'OptiPC se mettent à jour tout seuls. Les valeurs sont dans le
# fichier update.json joint à la release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
          # Le moteur annonce sa version au serveur de mises à jour
          $f = 'app/src/engine/functions.ps1'
          $c = [IO.File]::ReadAllText($f)
          $c = [regex]::Replace($c, "function Get-OptiPCVersion \{ '[^']*' \}", "function Get-OptiPCVersion { '$v' }")
          [IO.File]::WriteAllText($f, $c, (New-Object System.Text.UTF8Encoding($false)))

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilation
        shell: pwsh
        run: |
          dotnet build app/src/OptiPC.csproj -c Release -p:Version=${{ steps.v.outputs.version }} -p:FileVersion=${{ steps.v.outputs.version }}.0 -p:AssemblyVersion=${{ steps.v.outputs.version }}.0
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item app/src/bin/Release/net472/OptiPC.exe, app/src/bin/Release/net472/OptiPC.exe.config build/

      - name: Signature de l'exe (SSL.com eSigner)
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/build/OptiPC.exe
          override: true
          environment_name: PROD

      - name: Installateur Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName /DAppVersion=${{ steps.v.outputs.version }} installer\OptiPC.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }

      - name: Signature de l'installateur
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/Setup/OptiPC-Setup-${{ steps.v.outputs.version }}.exe
          override: true
          environment_name: PROD

      - name: Vérification de la signature + fiche de mise à jour
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $f = "Setup/OptiPC-Setup-$v.exe"
          $sig = Get-AuthenticodeSignature $f
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'H2OCONSULTING') { throw "Signature invalide : $($sig.Status) $($sig.SignerCertificate.Subject)" }
          Copy-Item $f Setup/OptiPC-Setup.exe
          $sha = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $f).Length
          $u = [ordered]@{ version = $v; file = "OptiPC-Setup-$v.exe"; url = "https://github.com/secureetech/optipc/releases/download/v$v/OptiPC-Setup-$v.exe"; sha256 = $sha; size = $size; mandatory = $false; rollout = 100; published_at = (Get-Date -Format 'yyyy-MM-dd'); notes = "OptiPC $v" }
          $u | ConvertTo-Json | Set-Content Setup/update.json -Encoding utf8
          Get-Content Setup/update.json

      - name: Publication GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: OptiPC ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            Setup/OptiPC-Setup-${{ steps.v.outputs.version }}.exe
            Setup/OptiPC-Setup.exe
            Setup/update.json
